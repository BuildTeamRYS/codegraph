[package]
name = "codegraph-cli"
description = "codegraph command line interface"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "codegraph_cli"
path = "src/lib.rs"

[[bin]]
name = "codegraph"
path = "src/main.rs"

[dev-dependencies]
serde_json.workspace = true
rmcp = { version = "3.11", features = ["transport-io", "client", "transport-child-process"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
tempfile = "3"
serde.workspace = true

[dependencies]
codegraph-core.workspace = true
codegraph-parse.workspace = true
codegraph-lang-ts.workspace = true
codegraph-index.workspace = true
codegraph-agents.workspace = true
codegraph-store.workspace = true
codegraph-query.workspace = true
codegraph-mcp.workspace = true
tokio = { version = "1", features = ["full"] }
anyhow.workspace = true
blake3.workspace = true
clap = { version = "4", features = ["derive"] }
serde_json.workspace = true
serde.workspace = true
ureq = { version = "3.5.2", default-features = false, features = ["rustls"] }
sha2 = "0.11.1"
cfg-if = "1.0.5"
inquire = "0.7"

[package.metadata.generate-rpm]
name = "codegraph"
release = "1"
summary = "codegraph indexer and MCP server"
url = "https://github.com/BuildTeamRYS/codegraph"
assets = [
  { source = "target/release/codegraph", dest = "/usr/bin/codegraph", mode = "755" },
]
