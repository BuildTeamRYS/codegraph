[package]
name = "codegraph-cli"
description = "codegraph command line interface"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "codegraph_cli"
path = "src/lib.rs"

[[bin]]
name = "codegraph"
path = "src/main.rs"

[dev-dependencies]
serde_json.workspace = true
tempfile = "3"
serde.workspace = true

[dependencies]
tree-sitter = "0.25"
tree-sitter-typescript = "0.23"
codegraph-core.workspace = true
codegraph-parse.workspace = true
codegraph-store.workspace = true
anyhow.workspace = true
blake3.workspace = true
clap = { version = "4", features = ["derive"] }
