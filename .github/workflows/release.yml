name: Release Binaries

# Builds prebuilt binaries and publishes them as GitHub Release archives
# (.tar.gz / .zip) when a v* tag is pushed.
#
# Free-tier reality: no ARM hardware is required. Linux arm64 is built from an
# x86_64 runner; Windows publishes x64 only, which runs on ARM64 Windows via
# emulation. Linux stays static musl so it runs on every distro, including
# RPM-based ones. Release assets are exactly:
#   codegraph-linux-x64.tar.gz
#   codegraph-linux-arm64.tar.gz
#   codegraph-macos-x64.tar.gz
#   codegraph-macos-arm64.tar.gz
#   codegraph-windows-x64.zip
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset_name: codegraph-linux-x64.tar.gz
            bin_name: codegraph
            archive_type: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            asset_name: codegraph-linux-arm64.tar.gz
            bin_name: codegraph
            archive_type: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: codegraph-macos-arm64.tar.gz
            bin_name: codegraph
            archive_type: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_name: codegraph-macos-x64.tar.gz
            bin_name: codegraph
            archive_type: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: codegraph-windows-x64.zip
            bin_name: codegraph.exe
            archive_type: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package tar.gz (Unix)
        if: matrix.archive_type == 'tar.gz'
        run: tar -czvf ${{ matrix.asset_name }} -C target/${{ matrix.target }}/release ${{ matrix.bin_name }}

      - name: Package zip (Windows)
        if: matrix.archive_type == 'zip'
        shell: pwsh
        run: Compress-Archive -Path "target\${{ matrix.target }}\release\${{ matrix.bin_name }}" -DestinationPath "${{ matrix.asset_name }}"

      - name: Create or upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}
          generate_release_notes: true
