name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  fmt-clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-targets

  install-script:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace
      - run: sh install/test-install.sh

  install-script-windows:
    # install.ps1 has no shell harness like the sh one; exercise its full
    # lifecycle (from-dir install -> verify -> --version -> -Uninstall)
    # against the real script and the real windows-build binary.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace
      - name: Stage bundle with binary + checksums.txt
        shell: pwsh
        run: |
          $bundle = "$env:RUNNER_TEMP\bundle"
          New-Item -ItemType Directory -Force -Path $bundle | Out-Null
          Copy-Item target\debug\codegraph.exe "$bundle\codegraph-x86_64-pc-windows-msvc.exe"
          $hash = (Get-FileHash "$bundle\codegraph-x86_64-pc-windows-msvc.exe" -Algorithm SHA256).Hash
          Set-Content -Path "$bundle\checksums.txt" -Value "$hash  codegraph-x86_64-pc-windows-msvc.exe" -Encoding ASCII -NoNewline
      - name: Install from bundle
        shell: pwsh
        run: |
          .\install\install.ps1 -FromDir "$env:RUNNER_TEMP\bundle" -InstallRoot "$env:RUNNER_TEMP\cg" -SkipPath
          & "$env:RUNNER_TEMP\cg\bin\codegraph.exe" --version
      - name: Uninstall and verify removal
        shell: pwsh
        run: |
          .\install\install.ps1 -Uninstall -Yes -InstallRoot "$env:RUNNER_TEMP\cg"
          if (Test-Path "$env:RUNNER_TEMP\cg") { Write-Error "install root still present after -Uninstall"; exit 1 }
          Write-Host "uninstall removed the install root"
