[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/parse",
    "crates/store",
    "crates/query",
    "crates/mcp",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
codegraph-core = { path = "crates/core" }
codegraph-parse = { path = "crates/parse" }
codegraph-store = { path = "crates/store" }
codegraph-query = { path = "crates/query" }
codegraph-mcp = { path = "crates/mcp" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
