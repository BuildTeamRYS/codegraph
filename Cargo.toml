[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/parse",
    "crates/lang-ts",
    "crates/index",
    "crates/store",
    "crates/query",
    "crates/agents",
    "crates/mcp",
    "crates/cli",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "PolyForm-Shield-1.0.0"

[workspace.dependencies]
codegraph-core = { path = "crates/core" }
codegraph-parse = { path = "crates/parse" }
codegraph-lang-ts = { path = "crates/lang-ts" }
codegraph-index = { path = "crates/index" }
codegraph-store = { path = "crates/store" }
codegraph-query = { path = "crates/query" }
codegraph-agents = { path = "crates/agents" }
codegraph-mcp = { path = "crates/mcp" }
blake3 = "1"
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
jsonc-parser = { version = "0.34.0", features = ["cst", "serde_json"] }
toml_edit = "0.25.1"
